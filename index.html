  house(8.12,7.16,1.48,.85,.67,'#e9d2a4',colors.red);
  house(10.05,7.37,.87,.7,.58,'#e9d2a4',colors.roof);
  fence(7.1,8.79,4.2);
  for(let i=0;i<4;i++) {
    box(7.52+i*.83,8.44,.17,.24,.17,i%2?'#a26c56':'#f4ead5',.07);
    box(7.64+i*.83,8.46,.11,.12,.16,i%2?'#865945':'#e4dbc6',.09);
  }
  rows(7.14,9.22,7,.61,'#7b9859');
}
function buildOutskirts() {
  tile(-4,3.68,8.5,1.03,colors.road);
  tile(10.9,3.68,5.1,1.03,colors.road);
  tile(-4,4.55,4.5,.85,colors.road);
  tile(11.5,4.55,4.5,.85,colors.road);
  tile(3.68,-3,.93,3.22,colors.road);
  tile(3.68,9.7,.93,4.3,colors.road);
  if(area==='otawara'){
    tile(5.15,-3,1.13,3.12,colors.water);
    tile(5.15,9.88,1.13,4.12,colors.water);
    tile(5.39,-3,.065,3.12,'#a8d1cb');
    tile(5.39,9.88,.065,4.12,'#a8d1cb');
  }
  for(let i=0;i<12;i++){
    const x=-3.73+i*1.61;
    if(x>4.8&&x<6.3)continue;
    const length=i%3===0?1.18:1.02;
    const wall=['#e0cdab','#dfb290','#b9c4b7','#ddd0c4'][i%4];
    const roof=['#55616c','#9f6857','#6e867d'][i%3];
    if(!(area==='nasu'&&x<4))house(x,-1.8,length,.94,.48+(i%4)*.18,wall,roof);
    house(x,11.54,length,.86,.49+(i%3)*.2,wall,roof);
    tile(x-.12,12.53,1.32,.75,'#87a171');
    tree(x+.74,12.7,i%3?'#789a64':'#c18d93',.72);
    if(i%3===1)box(x+.13,12.67,.42,.3,.047,'#b5a287');
  }
  for(const x of [-3.7,12.28]){
    for(let i=0;i<4;i++){
      tile(x+i*.84,6.02,.75,3.18,['#9fab64','#b5b76c','#94a065','#b6b57b'][i]);
      for(let r=0;r<4;r++)tile(x+i*.84+.08+r*.15,6.14,.042,2.92,'#d5c78c');
    }
    rows(x,10.04,7,.51,'#6a8c55');
  }
  for(let i=0;i<10;i++){
    const x=-3.65+i*2.02;
    if(x>4.8&&x<6.4)continue;
    tree(x,area==='otawara'?4.86:5.58,i%4?'#75945f':'#b98088',.8);
  }
  for(let i=0;i<23;i++){
    const x=-3.87+i*.87;
    if(area==='otawara'&&x>4.85&&x<6.45)continue;
    tile(x,area==='otawara'?4.16:4.95,.35,.027,'#f8e9c5');
  }
  for(let i=0;i<6;i++)tile(3.78+i*.12,3.51,.06,.23,'#f8eed3');
  if(area==='nasu'){
    rows(-3.48,-1.82,12,.57,'#608257');
    rows(-3.72,-2.54,12,.58,'#738d5b');
  }
}
function movingObjects(time) {
  const travel=(time*.87)%42;
  const eastbound=travel<21;
  const x=eastbound?-4.7+travel:37.3-travel;
  const trafficZ=area==='otawara'?4.23:5.02;
  const car=(x,z,color)=>{
    box(x,z,.44,.21,.14,color,.035);
    box(x+.12,z+.01,.2,.19,.095,'#668191',.17);
    box(x+.018,z-.012,.095,.028,.07,'#38424b',.035);
    box(x+.31,z-.012,.095,.028,.07,'#38424b',.035);
  };
  if(x>=-4&&x<=15.55)car(x,trafficZ+(eastbound?.14:-.22),'#ca745f');
  const other=15.6-((time*.62+7)%20.3);
  if(other>=-4)car(other,trafficZ-.18,'#f4db9b');
  if(area==='nasu'){
    const t=(1-Math.cos(time*.55))/2;
    const cableX=1.48+2.14*t,cableZ=1.37+1.17*t,cableY=1.92-.86*t;
    box(cableX+.12,cableZ+.08,.035,.035,.26,'#465962',cableY-.24);
    box(cableX,cableZ,.27,.22,.23,'#b95749',cableY-.43);
    box(cableX+.025,cableZ+.224,.22,.02,.11,'#a0ccd0',cableY-.37);
  }else{
    for(let i=0;i<8;i++){
      const z=-2.78+(i*2.19+time*.47)%16.38;
      box(5.7+(i%3)*.15,z,.14,.03,.003,'#bfdfd8',.007);
    }
  }
}
function makeTown() {
  faces=[];
  ground=[];
  tile(-4,-3,20,17,colors.grass);
  buildOutskirts();
  if(area==='otawara')buildOtawara();
  else buildNasu();
}
function render() {
  if(!ctx)return;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  const ratio=Math.min(devicePixelRatio,2);
  if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){
    canvas.width=Math.round(w*ratio);
    canvas.height=Math.round(h*ratio);
  }
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,w,h);
  const scale=zoom*Math.min(w/26.8,h/(overhead?26:17));
  const pitch=overhead?Math.PI/2:.56;
  const cosine=Math.cos(angle),sine=Math.sin(angle);
  const cp=Math.cos(pitch),sp=Math.sin(pitch);
  function project([x,y,z]) {
    const u=x-centerX,v=z-centerZ;
    const lateral=u*cosine-v*sine, depth=u*sine+v*cosine;
    return [w*.5+lateral*scale,h*.54+(depth*sp-y*cp)*scale,depth*cp+y*sp];
  }
  function paint(points,color) {
    ctx.beginPath();
    points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }
  const corners=townCorners;
  const shadow=corners.map(p=>project(p)).map(([x,y])=>[x+4,y+scale*.45]);
  ctx.save();
  ctx.shadowColor='#324a4e77';
  ctx.shadowBlur=24;
  paint(shadow,'#617b7644');
  ctx.restore();
  corners.forEach((corner,i)=>{
    const next=corners[(i+1)%corners.length];
    paint([corner,next,[next[0],-.43,next[2]],[corner[0],-.43,corner[2]]].map(project),'#827d63');
  });
  for(const tile of ground)paint(tile.points.map(project),tile.color);
  const staticFaces=faces;
  faces=[];
  movingObjects(elapsed);
  const sceneFaces=staticFaces.concat(faces);
  faces=staticFaces;
  const projected=sceneFaces.map(({points,color})=>{
    const vertices=points.map(project);
    return {vertices,color,depth:vertices.reduce((sum,p)=>sum+p[2],0)/vertices.length};
  });
  projected.sort((a,b)=>a.depth-b.depth);
  for(const face of projected)paint(face.vertices,face.color);
  for(const button of get('pins').children) {
    const spot=spots[Number(button.dataset.index)];
    const [x,z,height]=spot.model;
    const [px,py]=project([x,overhead?0:height,z]);
    const hidden=px<16||px>w-16||py<37||py>h-16;
    if(button.hidden!==hidden)button.hidden=hidden;
    button.style.left=px+'px';
    button.style.top=py+'px';
  }
}
function choose(spot) {
  selectedSpot=spot;
  for(const button of document.querySelectorAll('[data-index]')){
    button.setAttribute('aria-pressed',String(spots[Number(button.dataset.index)]===spot));
  }
  get('detail').hidden=false;
  get('name').textContent=spot.name;
  get('description').textContent=spot.description;
  get('official').href=spot.url;
  get('directions').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(spot.location);
  get('photo').hidden=!spot.photo;
  if(spot.photo){
    const {url,alt,page,author,license}=spot.photo;
    get('picture').src=url;
    get('picture').alt=alt;
    const source=document.createElement('a');
    source.href=page;
    source.textContent=author+' / Wikimedia Commons';
    const terms=document.createElement('a');
    terms.href='https://creativecommons.org/licenses/'+(license==='3.0'?'by-sa':'by')+'/'+license+'/';
    terms.textContent=license==='3.0'?'CC BY-SA 3.0':'CC BY 4.0';
    get('credit').replaceChildren(source,document.createTextNode(' · '),terms,document.createTextNode(' · 表示時にトリミング'));
  }
}
function loadArea() {
  get('pins').replaceChildren();
  get('spots').replaceChildren();
  selectedSpot=null;
  get('detail').hidden=true;
  spots.forEach((spot,index)=>{
    if(spot.region!==area)return;
    for(const parent of ['pins','spots']) {
      const button=document.createElement('button');
      button.type='button';
      button.dataset.index=index;
      button.setAttribute('aria-pressed','false');
      button.addEventListener('click',()=>choose(spot));
      if(parent==='pins'){
        button.className='pin';
        button.setAttribute('aria-label',spot.name);
        const label=document.createElement('span');
        label.textContent=spot.short;
        button.append(String(spot.number),label);
      }else{
        const number=document.createElement('b');
        number.textContent=spot.number;
        number.setAttribute('aria-hidden','true');
        const label=document.createElement('span');
        const category=document.createElement('small');
        category.textContent=spot.type;
        label.append(spot.name,category);
        button.append(number,label);
      }
      get(parent).append(button);
    }
  });
  makeTown();
  render();
}
get('tabs').addEventListener('click',event=>{
  const button=event.target.closest('[data-area]');
  if(!button||button.dataset.area===area)return;
  area=button.dataset.area;
  for(const item of get('tabs').children)item.setAttribute('aria-pressed',String(item===button));
  resetCamera();
  get('zoomOut').disabled=false;
  get('zoomIn').disabled=false;
  loadArea();
});
get('left').addEventListener('click',()=>{angle-=Math.PI/6;render();});
get('right').addEventListener('click',()=>{angle+=Math.PI/6;render();});
get('overhead').addEventListener('click',()=>{
  overhead=!overhead;
  get('overhead').setAttribute('aria-pressed',String(overhead));
  render();
});
function resetCamera(){
  zoom=1;
  centerX=6;
  centerZ=5;
  angle=-.55;
  overhead=false;
  get('overhead').setAttribute('aria-pressed','false');
}
canvas.addEventListener('pointerdown',event=>{
  if(!event.isPrimary||event.button!==0)return;
  drag={id:event.pointerId,x:event.clientX,y:event.clientY,angle,pan:event.shiftKey,centerX,centerZ};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(drag?.id!==event.pointerId)return;
  if(drag.pan){
    const inverseScale=1/(zoom*Math.min(canvas.clientWidth/26.8,canvas.clientHeight/(overhead?26:17)));
    const lateral=(drag.x-event.clientX)*inverseScale;
    const depth=(drag.y-event.clientY)*inverseScale/(overhead?1:Math.sin(.56));
    centerX=Math.max(-3,Math.min(15,drag.centerX+lateral*Math.cos(angle)+depth*Math.sin(angle)));
    centerZ=Math.max(-2,Math.min(13,drag.centerZ-lateral*Math.sin(angle)+depth*Math.cos(angle)));
  }else angle=drag.angle+(event.clientX-drag.x)*.009;
  render();
});
canvas.addEventListener('lostpointercapture',()=>{drag=null;});
get('picture').addEventListener('error',()=>{get('photo').hidden=true;});
function setZoom(next){
  zoom=Math.max(.85,Math.min(3,next));
  get('zoomOut').disabled=zoom<=.85;
  get('zoomIn').disabled=zoom>=3;
  render();
}
get('zoomIn').addEventListener('click',()=>setZoom(zoom*1.3));
get('zoomOut').addEventListener('click',()=>setZoom(zoom/1.3));
get('reset').addEventListener('click',()=>{resetCamera();setZoom(1);});
get('focusSpot').addEventListener('click',()=>{
  if(!selectedSpot)return;
  [centerX,centerZ]=selectedSpot.model;
  setZoom(2.3);
});
function animation(time){
  if(paused||document.hidden){previousFrame=null;frameId=undefined;return;}
  if(previousFrame===null)previousFrame=time;
  if(time-previousFrame>=33){
    elapsed+=Math.min(time-previousFrame,100)/1000;
    previousFrame=time;
    render();
  }
  frameId=requestAnimationFrame(animation);
}
function syncMotion(){
  get('motion').textContent=paused?'動かす':'動きを止める';
  get('motion').setAttribute('aria-pressed',String(paused));
  if(paused||document.hidden){
    cancelAnimationFrame(frameId);
    frameId=undefined;
    previousFrame=null;
  }else if(frameId===undefined)frameId=requestAnimationFrame(animation);
}
get('motion').addEventListener('click',()=>{paused=!paused;syncMotion();});
reducedMotion.addEventListener('change',event=>{paused=event.matches;syncMotion();});
document.addEventListener('visibilitychange',syncMotion);
new ResizeObserver(render).observe(get('scene'));
loadArea();
syncMotion();
</script>
